[project]
name = "nplates-data"
version = "0.1.0"
description = "Shared domain models, collection names and index definitions for The Nice Plates."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nplates_data*"]
